server {
  listen 8080;
  root /usr/share/nginx/html;
  client_max_body_size 21m;   # dépôt d'échantillons : doit rester >= MAX_UPLOAD_BYTES
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location /api/ws/ {
    proxy_pass http://backend:8000/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }
  location /api/ { proxy_pass http://backend:8000/; }
  location / { try_files $uri /index.html; }
}
