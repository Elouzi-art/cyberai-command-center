[project]
name = "cyberai-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142.2,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "prometheus-client>=0.20,<1",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "argon2-cffi>=23,<26",
  "httpx>=0.27,<1",
]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "jsonschema>=4.23", "ruff>=0.6", "mypy>=1.11", "types-PyYAML", "pip-audit"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
