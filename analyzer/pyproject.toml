[project]
name = "cyberai-analyzer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pefile>=2024.8.26,<2026"]
[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.23", "ruff>=0.6", "mypy>=1.11", "pip-audit"]

[tool.setuptools.packages.find]
include = ["cyberai_analyzer*"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]

[tool.mypy]
strict = true
[[tool.mypy.overrides]]
module = "pefile"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
